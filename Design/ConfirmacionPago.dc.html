<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Financial Flow — Confirmar pago</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  body { margin: 0; background: #F3F6F4; }
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F3F6F4; font-family: 'IBM Plex Sans', Arial, sans-serif; color: #0E211C; overflow: hidden;">

  <!-- Referencia simplificada y atenuada del dashboard detrás -->
  <div style="padding: 24px 20px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 13px; color: #51645D;">Hola</span>
      <span style="font-size: 22px; font-weight: 600;">Tu panorama</span>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #D7E0DB; border-radius: 14px; height: 120px;"></div>
    <div style="background: #FFFFFF; border: 1px solid #D7E0DB; border-radius: 14px; height: 100px;"></div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(14,33,28,0.5);"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 22px 22px 0 0; box-shadow: 0 -8px 24px rgba(14,33,28,0.14); padding: 12px 20px 36px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 20px;">

    <div style="width: 36px; height: 4px; border-radius: 999px; background: #D7E0DB;"></div>

    <sc-if value="{{pending}}" hint-placeholder-val="{{true}}">
      <div style="width: 100%; display: flex; flex-direction: column; gap: 20px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;">
          <span style="font-size: 18px; font-weight: 600;">¿Ya pagaste Arriendo?</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 500;">$450.000</span>
          <span style="font-size: 13px; color: #51645D;">Vence hoy. Confirma para mantener tu flujo del mes al día.</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <button type="button" onClick="{{confirm}}" style="width: 100%; height: 52px; border-radius: 8px; border: none; background: #1E8F5D; color: #F3FBF8; font-size: 16px; font-weight: 600; font-family: 'IBM Plex Sans', Arial, sans-serif; cursor: pointer;">Ya pagué</button>
          <button type="button" style="width: 100%; height: 40px; border-radius: 8px; border: none; background: transparent; color: #51645D; font-size: 14px; font-family: 'IBM Plex Sans', Arial, sans-serif; cursor: pointer;">Todavía no, recuérdamelo luego</button>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{confirmed}}" hint-placeholder-val="{{false}}">
      <div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 8px 0 4px; text-align: center;">
        <div style="width: 56px; height: 56px; border-radius: 999px; background: #1E8F5D; display: flex; align-items: center; justify-content: center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12L9.5 17.5L20 6" stroke="#F3FBF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 18px; font-weight: 600;">¡Listo!</span>
          <span style="font-size: 13px; color: #51645D;">Marcamos Arriendo como pagado.</span>
        </div>
      </div>
    </sc-if>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { confirmed: false };
  }
  renderVals() {
    const confirmed = this.state.confirmed;
    return {
      confirmed,
      pending: !confirmed,
      confirm: () => this.setState({ confirmed: true })
    };
  }
}
</script>
</body>
</html>
