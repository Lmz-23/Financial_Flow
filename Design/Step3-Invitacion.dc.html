<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Financial Flow — Paso 3: Invitación a profundizar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  body { margin: 0; background: #F3F6F4; }
  a { text-decoration: none; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6F4; font-family: 'IBM Plex Sans', Arial, sans-serif; color: #0E211C; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; gap: 12px; padding: 20px 16px 8px 16px;">
    <a href="Step2-Flujo.dc.html" aria-label="Volver" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12.5 15L7.5 10L12.5 5" stroke="#0E211C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div style="flex: 1; display: flex; gap: 4px;">
      <div style="flex: 1; height: 4px; border-radius: 999px; background: #0B3B36;"></div>
      <div style="flex: 1; height: 4px; border-radius: 999px; background: #0B3B36;"></div>
      <div style="flex: 1; height: 4px; border-radius: 999px; background: #0B3B36;"></div>
      <div style="flex: 1; height: 4px; border-radius: 999px; background: #D7E0DB;"></div>
    </div>
    <div style="width: 44px; height: 44px; flex-shrink: 0;"></div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 24px;">

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600;">¿Quieres ir más allá?</h1>
      <p style="margin: 0; font-size: 13px; line-height: 18px; color: #51645D;">Actívalo si te sirve ahora. Si no, lo encuentras después en tu panel — nunca se pierde nada de lo que ya cargaste.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="3">
        <button type="button" onClick="{{item.toggle}}" aria-pressed="{{item.ariaPressed}}" style="{{item.cardStyle}}">
          <span style="display: flex; flex-direction: column; gap: 4px; flex: 1; text-align: left;">
            <span style="display: block; font-size: 16px; line-height: 22px; font-weight: 600; color: #0E211C;">{{item.title}}</span>
            <span style="display: block; font-size: 13px; line-height: 18px; color: #51645D;">{{item.desc}}</span>
          </span>
          <span style="{{item.dotStyle}}">
            <sc-if value="{{item.active}}" hint-placeholder-val="{{true}}">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 6L5 9L10 3" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </sc-if>
          </span>
        </button>
      </sc-for>
    </div>

  </div>

  <div style="padding: 16px 20px 28px 20px; display: flex; flex-direction: column; gap: 12px;">
    <a href="Step4-Completar.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 8px; background: #0B3B36; color: #F3FBF8; font-size: 16px; font-weight: 600;">Continuar</a>
    <a href="Step4-Completar.dc.html" style="display: flex; align-items: center; justify-content: center; height: 24px; color: #51645D; font-size: 13px;">Prefiero explorarlo yo mismo</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cashflow: false, debt: false, goal: false };
  }
  renderVals() {
    const defs = [
      { key: 'cashflow', title: 'Índice de Flujo de Caja', desc: 'Mide qué tanto de tus gastos ya cubre tu ingreso pasivo.', color: '#0B3B36' },
      { key: 'debt', title: 'Deudas', desc: 'Tarjetas y préstamos, con proyección de pago automática.', color: '#B5472E' },
      { key: 'goal', title: 'Metas de ahorro', desc: 'Ponle número y fecha a lo que estás ahorrando.', color: '#A97723' }
    ];
    const items = defs.map((d) => {
      const active = this.state[d.key];
      return {
        key: d.key,
        title: d.title,
        desc: d.desc,
        active,
        ariaPressed: active ? 'true' : 'false',
        cardStyle: `width:100%;box-sizing:border-box;text-align:left;font-family:'IBM Plex Sans',Arial,sans-serif;background:#FFFFFF;border-radius:8px;padding:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;cursor:pointer;border:${active ? `1.5px solid ${d.color}` : '1px solid #D7E0DB'};`,
        dotStyle: `width:22px;height:22px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:${active ? `1.5px solid ${d.color}` : '1.5px solid #D7E0DB'};background:${active ? d.color : 'transparent'};`,
        toggle: () => this.setState({ [d.key]: !active })
      };
    });
    return { items };
  }
}
</script>
</body>
</html>
