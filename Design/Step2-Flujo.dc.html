<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Financial Flow — Paso 2: Flujo esencial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  body { margin: 0; background: #F3F6F4; }
  a { text-decoration: none; }
  input::placeholder { color: #9FADA7; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6F4; font-family: 'IBM Plex Sans', Arial, sans-serif; color: #0E211C; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; gap: 12px; padding: 20px 16px 8px 16px;">
    <a href="Step1-Cuentas.dc.html" aria-label="Volver" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12.5 15L7.5 10L12.5 5" stroke="#0E211C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div style="flex: 1; display: flex; gap: 4px;">
      <div style="flex: 1; height: 4px; border-radius: 999px; background: #0B3B36;"></div>
      <div style="flex: 1; height: 4px; border-radius: 999px; background: #0B3B36;"></div>
      <div style="flex: 1; height: 4px; border-radius: 999px; background: #D7E0DB;"></div>
      <div style="flex: 1; height: 4px; border-radius: 999px; background: #D7E0DB;"></div>
    </div>
    <div style="width: 44px; height: 44px; flex-shrink: 0;"></div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 28px;">

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600;">¿Cómo se mueve tu dinero?</h1>
      <p style="margin: 0; font-size: 13px; line-height: 18px; color: #51645D;">Esto es lo mínimo para armar tu panorama. Ajusta los detalles cuando quieras.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="width: 8px; height: 8px; border-radius: 999px; background: #1E8F5D; flex-shrink: 0;"></span>
        <h2 style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600;">Ingreso recurrente</h2>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="income-name" style="font-size: 12px; font-weight: 500; color: #51645D;">¿Cómo entra tu dinero?</label>
        <input id="income-name" type="text" placeholder="Ej. Sueldo, viajes, ventas" style="height: 48px; border-radius: 8px; border: 1px solid #D7E0DB; background: #FFFFFF; padding: 0 14px; font-size: 15px; font-family: 'IBM Plex Sans', Arial, sans-serif; color: #0E211C; box-sizing: border-box;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="income-amount" style="font-size: 12px; font-weight: 500; color: #51645D;">Monto aproximado</label>
        <input id="income-amount" type="text" placeholder="$0" style="height: 48px; border-radius: 8px; border: 1px solid #D7E0DB; background: #FFFFFF; padding: 0 14px; font-family: 'IBM Plex Mono', monospace; font-size: 16px; color: #0E211C; box-sizing: border-box;">
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <sc-for list="{{incomePills}}" as="p" hint-placeholder-count="3">
          <button type="button" style="{{p.style}}" onClick="{{p.pick}}">{{p.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="height: 1px; background: #D7E0DB;"></div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="width: 8px; height: 8px; border-radius: 999px; background: #B5472E; flex-shrink: 0;"></span>
        <h2 style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600;">Gasto recurrente</h2>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="expense-name" style="font-size: 12px; font-weight: 500; color: #51645D;">¿En qué se te va la mayor parte?</label>
        <input id="expense-name" type="text" placeholder="Ej. Arriendo, servicios" style="height: 48px; border-radius: 8px; border: 1px solid #D7E0DB; background: #FFFFFF; padding: 0 14px; font-size: 15px; font-family: 'IBM Plex Sans', Arial, sans-serif; color: #0E211C; box-sizing: border-box;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="expense-amount" style="font-size: 12px; font-weight: 500; color: #51645D;">Monto aproximado</label>
        <input id="expense-amount" type="text" placeholder="$0" style="height: 48px; border-radius: 8px; border: 1px solid #D7E0DB; background: #FFFFFF; padding: 0 14px; font-family: 'IBM Plex Mono', monospace; font-size: 16px; color: #0E211C; box-sizing: border-box;">
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <sc-for list="{{expensePills}}" as="p" hint-placeholder-count="3">
          <button type="button" style="{{p.style}}" onClick="{{p.pick}}">{{p.label}}</button>
        </sc-for>
      </div>
    </div>

  </div>

  <div style="padding: 16px 20px 28px 20px;">
    <a href="Step3-Invitacion.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 8px; background: #0B3B36; color: #F3FBF8; font-size: 16px; font-weight: 600;">Continuar</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { incomeFreq: 'Mensual', expenseFreq: 'Mensual' };
  }
  renderVals() {
    const freqs = ['Semanal', 'Quincenal', 'Mensual'];
    const pillStyle = (selected, activeColor) => selected
      ? `padding:8px 16px;border-radius:999px;border:1.5px solid ${activeColor};background:${activeColor};color:#F3FBF8;font-size:13px;font-weight:500;font-family:'IBM Plex Sans',Arial,sans-serif;cursor:pointer;`
      : `padding:8px 16px;border-radius:999px;border:1px solid #D7E0DB;background:#FFFFFF;color:#51645D;font-size:13px;font-weight:500;font-family:'IBM Plex Sans',Arial,sans-serif;cursor:pointer;`;
    const incomePills = freqs.map((f) => ({
      label: f,
      style: pillStyle(f === this.state.incomeFreq, '#1E8F5D'),
      pick: () => this.setState({ incomeFreq: f })
    }));
    const expensePills = freqs.map((f) => ({
      label: f,
      style: pillStyle(f === this.state.expenseFreq, '#B5472E'),
      pick: () => this.setState({ expenseFreq: f })
    }));
    return { incomePills, expensePills };
  }
}
</script>
</body>
</html>
