<!DOCTYPE html>
<html lang="es">
  <head>

    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Financial Flow</title>
    <!-- Reset recomendado por react-native-web: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Fondo de la app (surface-page) desde el primer pintado: sin destello blanco antes de que cargue el JS. -->
    <style>
      html,
      body {
        background-color: #f3f6f4;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #0b1512;
        }
      }
    </style>
  </head>

  <body>
    <noscript>Financial Flow necesita JavaScript para funcionar.</noscript>
    <div id="root"></div>
  </body>
</html>
