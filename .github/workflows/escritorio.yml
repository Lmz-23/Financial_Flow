# Instalador de Windows (Electron) de Financial Flow.
# - En un PR que toque la versión de escritorio: compila y deja el .exe como artefacto de la ejecución.
# - Al subir una etiqueta vX.Y.Z: compila y publica el .exe en una Release con ese nombre.
# - También se puede lanzar a mano desde la pestaña Actions.
name: Instalador de escritorio

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'app/**'
      - 'vendor/**'
      - 'public/**'
      - 'metro.config.js'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/escritorio.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: escritorio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write # solo para crear la Release al subir una etiqueta
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Dependencias de la app
        run: npm ci

      - name: Exportación web
        run: npm run desktop:web

      - name: Dependencias del programa de escritorio
        working-directory: desktop
        run: npm ci

      - name: Versión del instalador desde la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Instalador .exe
        working-directory: desktop
        run: npm run dist:win

      - name: Guardar el instalador (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: Financial-Flow-Setup
          path: desktop/dist/*.exe
          retention-days: 30

      - name: Publicar la Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" desktop/dist/*.exe \
            --title "Financial Flow $GITHUB_REF_NAME" \
            --notes "Instalador de Windows. Como no va firmado, la primera vez Windows muestra «Windows protegió su PC»: toca «Más información» y luego «Ejecutar de todas formas». Los datos quedan en tu computador (%APPDATA%\\Financial Flow)."
